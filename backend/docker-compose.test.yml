version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: kubewatcher_test
    ports:
      - '5432:5432'
    volumes:
      - pgdata_test:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
    volumes:
      - minio_test:/data

  wiremock:
    image: wiremock/wiremock:2.35.0
    ports:
      - '8089:8080'
    volumes:
      - ./wiremock:/home/wiremock
    command: --verbose

volumes:
  pgdata_test:
  minio_test:
