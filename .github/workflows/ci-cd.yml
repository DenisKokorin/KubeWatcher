name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint and formatting warning
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.3'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Check Go formatting
        run: |
          gofmt -l . | tee gofmt.txt || true
          if [ -s gofmt.txt ]; then
            echo "::warning file=gofmt.txt::Go files are not formatted."
          fi
      - name: Run Go vet
        run: go vet $(go list ./... | grep -v '/e2e') || true
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend linter
        working-directory: frontend
        run: npm run lint || true

  backend-test:
    name: Backend unit tests and image build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.3'
      - name: Download Go modules
        run: go mod download
      - name: Run backend unit tests
        run: go test -v $(go list ./... | grep -v '/e2e')
      - name: Build backend Docker image
        run: docker build -t kubewatcher-backend:ci ./backend

  frontend-test:
    name: Frontend unit tests and image build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:run
      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build
      - name: Build frontend Docker image
        run: docker build -t kubewatcher-frontend:ci ./frontend

  deploy:
    name: Deploy to production environment
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kubewatcher-backend:${{ github.sha }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kubewatcher-frontend:${{ github.sha }}
