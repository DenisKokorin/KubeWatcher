name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint and formatting warning
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.3'
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Check Go formatting
        run: |
          gofmt -l . | tee gofmt.txt || true
          if [ -s gofmt.txt ]; then
            echo "::warning file=gofmt.txt::Go files are not formatted."
          fi
      - name: Run Go vet
        run: go vet $(go list ./... | grep -v '/e2e') || true
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend linter
        working-directory: frontend
        run: npm run lint || true

  backend-test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.3'
      - name: Download Go modules
        working-directory: backend
        run: go mod download
      - name: Run backend unit tests
        working-directory: backend
        run: go test -v $(go list ./... | grep -v '/e2e')


  frontend-test:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:run
      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build
