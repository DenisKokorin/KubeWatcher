services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: redknight
      POSTGRES_PASSWORD: redknight
      POSTGRES_DB: fullstack
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - 6379:6379
    command: redis-server --requirepass redknight
    env_file:
      - ./backend/env/.env
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/env/.env
    # volumes:
      # Mount your Windows user directory so the kubeconfig and Minikube certificates can be rewritten.
      # - ${HOST_USERS_DIR:-C:/Users/denis}:/host/C/Users/denis:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 7979:7979
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:80
    # depends_on:
    #   - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
